name: ci

# The tests of each package, on the oldest and the newest version of its language it supports.
# No publish step.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.27"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/mcptest/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      # A real MCP client and server through the guard. A module of its own: the
      # official MCP SDK needs Go 1.25, newer than the module's oldest.
      - if: matrix.go != '1.24'
        working-directory: go/mcptest
        run: go vet ./... && go test -race ./...

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: ruby
          bundler-cache: true
      - run: bundle exec rake test
      # The token tests again, outside the bundle, on the json gem Ruby 3.2 ships: 2.6.3.
      # Only the token tests: the MCP tests need the mcp gem of the bundle.
      - name: Token tests on the bundled json gem
        if: matrix.ruby == '3.2'
        run: >-
          ruby -Ilib -Itest -e 'require "json"; abort "json #{JSON::VERSION}" if Gem::Version.new(JSON::VERSION) >= Gem::Version.new("2.10");
          require "./test/tokens_test"; require "./test/pyjwt_parity_test"'

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        framework: ["net8.0", "net10.0"]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      # Both SDKs: the .NET 10 SDK builds both targets, and each job runs the tests on one runtime.
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build --framework ${{ matrix.framework }}

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.6"]
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
