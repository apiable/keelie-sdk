name: ci

# The tests of each package, on the oldest and the newest version of its language it supports.
# No publish step.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: ruby
          bundler-cache: true
      - run: bundle exec rake test
      # The token tests again, outside the bundle, on the json gem Ruby 3.2 ships: 2.6.3.
      # Only the token tests: the MCP tests need the mcp gem of the bundle.
      - name: Token tests on the bundled json gem
        if: matrix.ruby == '3.2'
        run: >-
          ruby -Ilib -Itest -e 'require "json"; abort "json #{JSON::VERSION}" if Gem::Version.new(JSON::VERSION) >= Gem::Version.new("2.10");
          require "./test/tokens_test"; require "./test/pyjwt_parity_test"'
