name: ci

# The tests of each package, on the oldest and the newest version of its language it supports.
# No publish step.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.27"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/mcptest/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      # A real MCP client and server through the guard. A module of its own: the
      # official MCP SDK needs Go 1.25, newer than the module's oldest.
      - if: matrix.go != '1.24'
        working-directory: go/mcptest
        run: go vet ./... && go test -race ./...
