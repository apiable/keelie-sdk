[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "apiable"
version = "0.0.3"
description = "Placeholder for the Keelie SDK, by Apiable. Token checks, scopes and usage reports for your API, off the request path."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Apiable", email = "hello@apiable.io" }]
keywords = ["fastapi", "api", "monetization", "metering", "oauth2", "jwt"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://apiable.io"
Documentation = "https://apiable.io/docs"
Source = "https://github.com/apiable/keelie-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/apiable"]
